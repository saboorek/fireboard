name: Deploy - Production (lscofd)

# Wdrożenie produkcyjne uruchamia się WYŁĄCZNIE przy push na gałąź `master`.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Wszystkie zmienne (ścieżka, nazwa procesu PM2) pochodzą z sekretów
          # środowiska "production" w GitHub -> nigdy nie mieszają się ze stagingiem.
          script: |
            set -e
            cd "${{ secrets.PROD_PATH }}"

            echo "==> Pobieranie najnowszej wersji gałęzi master..."
            git fetch origin master
            git reset --hard origin/master

            # Instaluje zależności TYLKO jeśli package-lock.json się zmienił
            # od ostatniego udanego deployu (lub node_modules nie istnieje).
            install_if_needed() {
              local hash_file=".ci-lock-hash"
              local current_hash
              current_hash=$(sha256sum package-lock.json | awk '{print $1}')
              if [ -d node_modules ] && [ -f "$hash_file" ] && [ "$(cat "$hash_file")" = "$current_hash" ]; then
                echo "==> [$(basename "$PWD")] Zależności bez zmian - pomijam npm ci"
              else
                echo "==> [$(basename "$PWD")] Zmiana w package-lock.json (lub brak node_modules) - instaluję..."
                npm ci
                echo "$current_hash" > "$hash_file"
              fi
            }

            echo "==> Backend..."
            cd backend
            install_if_needed
            npm run build

            echo "==> Frontend..."
            cd ../frontend
            install_if_needed
            npm run build

            echo "==> Restart backendu (PM2)..."
            pm2 restart "${{ secrets.PROD_PM2_NAME }}" --update-env || pm2 start dist/index.js --name "${{ secrets.PROD_PM2_NAME }}" --cwd "${{ secrets.PROD_PATH }}/backend"
            pm2 save

            echo "==> Deploy produkcyjny zakończony."

