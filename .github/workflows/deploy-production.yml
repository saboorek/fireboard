name: Deploy - Production (lscofd)

# Wdrożenie produkcyjne uruchamia się WYŁĄCZNIE przy push na gałąź `master`.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Wszystkie zmienne (ścieżka, nazwa procesu PM2) pochodzą z sekretów
          # środowiska "production" w GitHub -> nigdy nie mieszają się ze stagingiem.
          script: |
            set -e
            cd "${{ secrets.PROD_PATH }}"

            echo "==> Pobieranie najnowszej wersji gałęzi master..."
            git fetch origin master
            git reset --hard origin/master

            echo "==> Instalacja i build backendu..."
            cd backend
            npm ci
            npm run build

            echo "==> Instalacja i build frontendu..."
            cd ../frontend
            npm ci
            npm run build

            echo "==> Restart backendu (PM2)..."
            pm2 restart "${{ secrets.PROD_PM2_NAME }}" --update-env || pm2 start dist/index.js --name "${{ secrets.PROD_PM2_NAME }}" --cwd "${{ secrets.PROD_PATH }}/backend"
            pm2 save

            echo "==> Deploy produkcyjny zakończony."

